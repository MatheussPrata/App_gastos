name: Android CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Restore fixed signing keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/gastos.keystore"
          echo "GASTOS_KEYSTORE_PATH=$RUNNER_TEMP/gastos.keystore" >> "$GITHUB_ENV"
          echo "Keystore restaurado."
        else
          echo "Sem KEYSTORE_BASE64: build usara a assinatura debug padrao."
        fi

    - name: Build Debug APK
      env:
        GASTOS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        GASTOS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        GASTOS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: |
        set -o pipefail
        ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvm.options="-Xmx768m" 2>&1 | tee build-debug.log

    - name: Upload build log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: build-debug.log
        retention-days: 3
        if-no-files-found: ignore

    - name: Run unit tests
      run: ./gradlew testDebugUnitTest --no-daemon -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvm.options="-Xmx768m"

    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: app/build/reports/tests/testDebugUnitTest
        retention-days: 7
        if-no-files-found: ignore

    - name: Show Kotlin errors
      if: failure()
      run: |
        echo "===== ERROS DE COMPILACAO ====="
        ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.jvmargs="-Xmx2g -XX:MaxMetaspaceSize=512m" -Dkotlin.daemon.jvm.options="-Xmx768m" 2>&1 \
          | grep -E "^e: |error:|Unresolved|Cannot|none of the following" | head -100 || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7

    - name: Cleanup keystore
      if: always()
      run: rm -f "$RUNNER_TEMP/gastos.keystore"
