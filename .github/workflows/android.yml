name: Android CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Diagnostics - compiles and resolved compose deps
      run: |
        ./gradlew :app:dependencies --configuration debugCompileClasspath --no-daemon \
          -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 | grep -iE "compose|material|navigation|FAILED|Could not" | head -80 || true
        echo "===== BUILD ====="
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" --stacktrace 2>&1 | tail -120

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
