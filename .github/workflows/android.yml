name: Android CI

on:
  push:
    branches: [ main, develop, master ]
  pull_request:
    branches: [ main, develop, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g"

    - name: Show Kotlin errors
      if: failure()
      run: |
        echo "===== ERROS DE COMPILACAO ====="
        ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx3g" 2>&1 \
          | grep -E "^e: |error:|Unresolved|Cannot|none of the following" | head -100 || true

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 7
